name: Sensei

options:
  createIntermediateGroups: true

packages:
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.6
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: c6446cf7bfb7cea76408013b614d4b2c530eaa03
    traits: []
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0

targets:
  Sensei:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sensei
    entitlements:
      path: Sensei/Sensei.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: Sensei/Info.plist
      properties:
        CFBundleDisplayName: SENSEI
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        GIDClientID: 934355792148-tlle93u7lt07l9vmj9kpttdfonk3lrer.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.934355792148-tlle93u7lt07l9vmj9kpttdfonk3lrer
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: HuggingFace
        product: HuggingFace
      - package: Transformers
        product: Tokenizers
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sensei.personal
        PRODUCT_NAME: SENSEI
        SWIFT_VERSION: 6.2
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: SENSEI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
