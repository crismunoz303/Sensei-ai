name: Sensei

options:
  createIntermediateGroups: true

packages:
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.6
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: c6446cf7bfb7cea76408013b614d4b2c530eaa03
    traits: []
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  Sensei:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sensei
    entitlements:
      path: Sensei/Sensei.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: HuggingFace
        product: HuggingFace
      - package: Transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sensei.personal
        PRODUCT_NAME: SENSEI
        SWIFT_VERSION: 6.2
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SENSEI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
