name: LuckyMiner
options:
  bundleIdPrefix: com.crismunoz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
targets:
  LuckyMiner:
    type: application
    platform: iOS
    sources:
      - LuckyMiner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crismunoz.luckyminer
        PRODUCT_NAME: LuckyMiner
        INFOPLIST_KEY_CFBundleDisplayName: "Lucky Miner"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
