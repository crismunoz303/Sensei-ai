name: Build Lucky Miner unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ lucky-miner-v0.1 ]
    paths:
      - "LuckyMinerApp/**"
      - ".github/workflows/build-lucky-miner-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: LuckyMinerApp
    steps:
      - uses: actions/checkout@v4
      - name: Validate SHA-256d Stratum header construction
        run: |
          mkdir -p build
          swiftc             LuckyMiner/Core/SHA256.swift             LuckyMiner/Core/StratumWork.swift             LuckyMiner/Networking/StratumModels.swift             scripts/stratum-vector/main.swift             -o build/stratum-vector
          build/stratum-vector
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild             -project LuckyMiner.xcodeproj             -scheme LuckyMiner             -configuration Release             -sdk iphoneos             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build
      - name: Package unsigned IPA
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LuckyMiner-v0.2-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyMiner-v0.2-unsigned-ipa
          path: LuckyMinerApp/LuckyMiner-v0.2-unsigned.ipa
          if-no-files-found: error
