name: Build SlipRadar unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - slipradar-v0.1
    paths:
      - 'SlipRadarApp/**'
      - '.github/workflows/build-slipradar.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: SlipRadarApp
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: SlipRadarApp
        run: |
          xcodebuild             -project SlipRadar.xcodeproj             -scheme SlipRadar             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build

      - name: Package IPA
        working-directory: SlipRadarApp
        run: |
          rm -rf Payload SlipRadar-v1.0.1-ui-hotfix-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SlipRadar.app Payload/
          rm -rf Payload/SlipRadar.app/_CodeSignature
          rm -f Payload/SlipRadar.app/embedded.mobileprovision
          xattr -cr Payload/SlipRadar.app || true
          plutil -lint Payload/SlipRadar.app/Info.plist
          test -x Payload/SlipRadar.app/SlipRadar
          /usr/bin/zip -X -qry SlipRadar-v1.0.1-ui-hotfix-unsigned.ipa Payload
          unzip -t SlipRadar-v1.0.1-ui-hotfix-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SlipRadar-v1.0.1-ui-hotfix-unsigned-ipa
          path: SlipRadarApp/SlipRadar-v1.0.1-ui-hotfix-unsigned.ipa
