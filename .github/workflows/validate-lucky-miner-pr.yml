name: Validate Lucky Miner PR

on:
  pull_request:
    branches: [ main ]
    paths:
      - "LuckyMinerApp/**"

jobs:
  build-lucky-miner:
    runs-on: macos-15
    defaults:
      run:
        working-directory: LuckyMinerApp
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild             -project LuckyMiner.xcodeproj             -scheme LuckyMiner             -configuration Release             -sdk iphoneos             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build
      - name: Package unsigned IPA
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LuckyMiner-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyMiner-unsigned-ipa
          path: LuckyMinerApp/LuckyMiner-unsigned.ipa
          if-no-files-found: error
