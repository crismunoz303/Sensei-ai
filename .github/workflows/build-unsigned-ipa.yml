name: Build SENSEI unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, sensei-local-persistence-drive, sensei-next-revision, sensei-v14-learning ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone without code signing
        run: |
          xcodebuild \
            -project Sensei.xcodeproj \
            -scheme Sensei \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify Google Sign-In runtime configuration
        run: |
          PLIST="build/Build/Products/Release-iphoneos/SENSEI.app/Info.plist"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          echo "GIDClientID: $(/usr/libexec/PlistBuddy -c 'Print :GIDClientID' "$PLIST")"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$PLIST" | grep -Fx 'com.googleusercontent.apps.934355792148-tlle93u7lt07l9vmj9kpttdfonk3lrer'

      - name: Audit built app
        run: |
          APP="build/Build/Products/Release-iphoneos/SENSEI.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -x "$APP/SENSEI"
          echo "Executable architecture:"
          lipo -info "$APP/SENSEI"
          echo "Embedded dynamic dependencies:"
          otool -L "$APP/SENSEI"
          echo "Bundle inventory:"
          find "$APP" -maxdepth 2 -type f | sort
          echo "Checking for unresolved build placeholders..."
          if grep -R -a -E '\$\([A-Z0-9_]+\)' "$APP/Info.plist"; then
            echo "Unresolved Info.plist build setting found"
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SENSEI.app Payload/
          zip -r SENSEI-V13.ipa Payload
          unzip -t SENSEI-V13.ipa
          test -f Payload/SENSEI.app/Info.plist
          test -x Payload/SENSEI.app/SENSEI

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SENSEI-V13
          path: SENSEI-V13.ipa
